# ─────────────────────────────────────────────────────────────────────────────
# cargo-deny — supply-chain policy for the Rust dependency graph.
# Run with: cargo deny check   (CI: .github/workflows/security.yml)
# ─────────────────────────────────────────────────────────────────────────────

[graph]
# The suite is Windows-only, so only this target's dependency graph matters.
targets = [{ triple = "x86_64-pc-windows-msvc" }]
all-features = true

[output]
feature-depth = 1

# ── Security advisories ──────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Only fail on crates *we* chose. A deep transitive dependency being
# unmaintained is real information, but it is not something this project can
# act on, and treating it as a build failure would mean either pinning an old
# graph or ignoring individual advisory ids that change every few months.
# Vulnerabilities remain a hard failure at any depth.
unmaintained = "workspace"
# Every ignore MUST carry a justification and a review date. An unexplained
# entry here is a policy violation, not a shortcut.
ignore = []

# ── Licence policy ───────────────────────────────────────────────────────────
[licenses]
# Permissive licences only. Anything copyleft (GPL/AGPL/LGPL/SSPL) would
# contaminate a proprietary product and is rejected by omission.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",          # File-level copyleft only; safe when unmodified.
    "BSL-1.0",
    "OpenSSL",
    "Unlicense",
]
confidence-threshold = 0.9
# Our own crates are `publish = false` and carry LicenseRef-Proprietary.
private = { ignore = true }
exceptions = []

# ── Dependency bans ──────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are referenced by path and carry no version requirement,
# which reads as a wildcard. Third-party wildcards are still refused.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = [
    # Unmaintained; its replacements are already in the graph.
    { crate = "openssl", reason = "use rustls or the Windows platform verifier" },
    { crate = "time:<0.3", reason = "RUSTSEC-2020-0071" },
]

skip = []
skip-tree = []

# ── Source policy ────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git dependencies are forbidden. A crate that only exists as a git reference
# has no release process, no yank mechanism, and no advisory coverage.
allow-git = []
