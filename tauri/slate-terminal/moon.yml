# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
id: 'slate-terminal'
layer: 'application'
language: 'typescript'
stack: 'frontend'
tags: ['tauri-app']

project:
  name: 'Terminal'
  description: 'Terminal emulator for the portable suite.'
  owner: 'ATOMANGELETTI'

dependsOn:
  - 'slate-ui-kit'
  - 'slate-ipc'
  - 'slate-tokens'
  - 'slate-bindings'
  - 'slate-utils'
  - 'slate-icons'

tasks:
  dev:
    command: 'bunx tauri dev'
    toolchain: 'bun'
    preset: 'server'

  dev-web:
    command: 'bunx vite'
    toolchain: 'bun'
    preset: 'server'

  build-web:
    command: 'bunx vite build'
    inputs:
      - 'src/**/*'
      - 'index.html'
      - 'vite.config.ts'
    outputs:
      - 'dist'
    toolchain: 'bun'

  # --no-bundle: the suite ships as a portable zip assembled by
  # scripts/bun-package.ts, never as an installer.
  build:
    deps:
      - '~:build-web'
    command: 'bunx tauri build --no-bundle'
    inputs:
      - 'src/**/*'
      - 'src-tauri/**/*'
      - '/crates/**/*'
      - '/Cargo.toml'
    toolchain: 'bun'
    options:
      # Cargo's own incremental cache is authoritative for the Rust half.
      cache: false

  typecheck:
    command: 'bunx tsc --build --pretty'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
    toolchain: 'bun'

  test:
    command: 'bun test $projectSource/tests/unit'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
    toolchain: 'bun'
